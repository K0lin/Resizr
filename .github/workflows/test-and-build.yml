name: Test and Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test, Lint, and Build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Install linter
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run go fmt check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not properly formatted:"
          gofmt -s -l .
          exit 1
        fi

    - name: Run linter
      run: golangci-lint run ./...

    - name: Run tests with coverage
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      env:
        S3_BUCKET: test-bucket
        S3_ACCESS_KEY: test-access-key
        S3_SECRET_KEY: test-secret-key
        REDIS_URL: redis://localhost:6379

    - name: Generate coverage report
      run: go tool cover -html=coverage.out -o coverage.html

    - name: Check coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
        echo "Current coverage: $COVERAGE%"
        # Threshold is 45% due to infrastructure dependencies:
        # - Repository package requires Redis/Badger instances for integration tests
        # - S3 storage requires MinIO/S3 instance
        # - Core business logic packages have >90% coverage
        THRESHOLD=45.0
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "Coverage $COVERAGE% is below threshold $THRESHOLD%"
          exit 1
        fi
        echo "Coverage $COVERAGE% meets threshold $THRESHOLD%"

        # Report core package coverage separately
        echo ""
        echo "=== Core Package Coverage (Business Logic) ==="
        echo "config:      $(go tool cover -func=coverage.out | grep 'internal/config.*total' | awk '{print $NF}')"
        echo "models:      $(go tool cover -func=coverage.out | grep 'internal/models.*total' | awk '{print $NF}')"
        echo "handlers:    $(go tool cover -func=coverage.out | grep 'internal/api/handlers.*total' | awk '{print $NF}')"
        echo "middleware:  $(go tool cover -func=coverage.out | grep 'internal/api/middleware.*total' | awk '{print $NF}')"
        echo "logger:      $(go tool cover -func=coverage.out | grep 'pkg/logger.*total' | awk '{print $NF}')"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage.html

    - name: Build Go program
      run: go build -v -ldflags="-w -s" -o resizr ./cmd/server/main.go
